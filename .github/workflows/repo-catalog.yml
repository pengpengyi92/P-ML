name: Repository catalog
on:
  push:
    paths: ['ml-repo/**', 'tests/**', 'scripts/collect_ml_ecosystem.py', 'ml-project/linear-regression-feature-scaling/**', 'ml-project/kaggle-matcher/**', '.github/workflows/repo-catalog.yml']
  pull_request:
    paths: ['ml-repo/**', 'tests/**', 'scripts/collect_ml_ecosystem.py', 'ml-project/linear-regression-feature-scaling/**', 'ml-project/kaggle-matcher/**', '.github/workflows/repo-catalog.yml']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s ml-project/linear-regression-feature-scaling -v
      - run: python ml-project/kaggle-matcher/benchmark.py
